name: Download images

on:
  workflow_dispatch:
  push:
    branches:
      - claude/implement-todo-item-Qv6uh
    paths:
      - download-images.py
      - .github/workflows/download-images.yml

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run download script
        run: python3 download-images.py

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain images/)" ]; then
            git add images/
            git commit -m "Add downloaded image files [skip ci]"
            git push
          else
            echo "No new images to commit."
          fi
